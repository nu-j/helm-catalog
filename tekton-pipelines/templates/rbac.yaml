# OpenShift Pipelines default SA + permission to read Gitea credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: {{ .Values.namespace | default "self-service" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform/managed-by: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-platform-credentials-reader
  namespace: {{ .Values.namespace | default "self-service" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform/managed-by: tekton-pipelines
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.gitea.credentialsSecret | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-gitea-credentials
  namespace: {{ .Values.namespace | default "self-service" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform/managed-by: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-platform-credentials-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: {{ .Values.namespace | default "self-service" | quote }}
