{{- /*
  argocd-cr.yaml — provisions the team ArgoCD instance via the OpenShift GitOps operator.

  The operator watches for ArgoCD CRs in namespaces labelled with
  argocd.argoproj.io/managed-by-cluster-argocd: openshift-gitops (set in namespace.yaml)
  and provisions a full ArgoCD stack (server, repo-server, application-controller, redis).

  Resource limits are intentionally smaller than the platform ArgoCD — teams deploy
  applications, not cluster infrastructure.

  SSA is NOT used here (unlike the platform argocd-instance chart) because this is a
  fresh namespace with no existing CR to patch. The operator creates the CR from scratch.
*/ -}}
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: {{ printf "%s-gitops" .Values.team.name | quote }}
  namespace: {{ printf "%s-gitops" .Values.team.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform/team: {{ .Values.team.name | quote }}
    platform/managed-by: platform-ops
spec:
  # ── OpenShift OAuth ────────────────────────────────────────────────────────
  # Configures Dex to use OpenShift OAuth so team members log in with their
  # cluster credentials — no separate ArgoCD user management needed.
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex

  rbac:
    defaultPolicy: ''
    # system:authenticated grants every logged-in OpenShift user read-only access.
    # Admins are granted via adGroupName (team's AD/GitHub group) or cluster-admins.
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      {{- if .Values.team.adGroupName }}
      g, {{ .Values.team.adGroupName }}, role:admin
      {{- end }}
    scopes: '[groups]'

  # Unique label key prevents resource ownership conflicts when the platform ArgoCD and
  # this team ArgoCD both run on the same cluster. The default app.kubernetes.io/instance
  # is shared across all ArgoCD instances — giving each team its own key scopes label
  # tracking to that instance only and eliminates "resource owned by another Application" errors.
  applicationInstanceLabelKey: {{ printf "argocd.argoproj.io/app-%s" .Values.team.name | quote }}

  server:
    resources: {{ .Values.argocd.resources.server | toYaml | nindent 6 }}
    # route.enabled tells the operator to create an OpenShift Route for the ArgoCD UI.
    # TLS is NOT configured here — the operator annotates the server Service with
    # service.beta.openshift.io/serving-cert-secret-name so OpenShift injects a cert
    # signed by the cluster service CA. The operator then creates a reencrypt route and
    # sets destinationCACertificate automatically. Do NOT set insecure: true or add a
    # tls: block — that contradicts reencrypt and causes "Application Not Available".
    route:
      enabled: true

  repo:
    resources: {{ .Values.argocd.resources.repo | toYaml | nindent 6 }}

  controller:
    resources: {{ .Values.argocd.resources.controller | toYaml | nindent 6 }}

  redis:
    resources: {{ .Values.argocd.resources.redis | toYaml | nindent 6 }}

  # exec.enabled maps to argocd-cm via spec.extraConfig (top-level).
  # spec.server.extraConfig is not a recognised field — the operator silently drops it.
  extraConfig:
    exec.enabled: "true"

  # Exclude high-churn resources to prevent constant diff noise
  resourceExclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      clusters:
      - '*'
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - coordination.k8s.io
      clusters:
      - '*'
      kinds:
      - Lease
    - apiGroups:
      - apps
      clusters:
      - '*'
      kinds:
      - ReplicaSet
