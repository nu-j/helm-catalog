{{- if ((.Values.seed).enabled | default true) }}
apiVersion: v1
kind: Secret
metadata:
  name: gitea-seed-credentials
  namespace: {{ .Values.namespace | default "gitea" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    platform/managed-by: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: seed
type: Opaque
stringData:
  admin-username: {{ (((.Values.gitea).gitea).admin).username | default "gitea_admin" | quote }}
  admin-password: {{ (((.Values.gitea).gitea).admin).password | default "d1sney" | quote }}
  seed-password: {{ .Values.seed.password | default "d1sney" | quote }}
{{- end }}
