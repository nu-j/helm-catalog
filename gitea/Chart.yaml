apiVersion: v2
name: gitea
description: >
  Platform wrapper for the official Gitea Helm chart.
  Deployed on the management cluster only — guarded by clusterType=management in the platform-apps template.
  Includes a demo seed Job that creates orgs (mice, ducks) and users for API automation demos.
type: application
version: 0.1.0
dependencies:
  - name: gitea
    version: "12.7.0"
    repository: https://dl.gitea.com/charts/
